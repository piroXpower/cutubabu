<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AJ Biryani Palace | Varadaiahpalem</title>
  <meta name="description" content="Authentic Andhra Dum Biryani on SH-4437, Varadaiahpalem." />

  <!-- Tailwind & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>

  <!-- Icons & Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-brand-darkBg text-stone-200 font-sans selection:bg-brand-gold selection:text-black pb-24 md:pb-0">

  <!-- Component Injections -->
  <div id="c-navbar"></div>
  <div id="c-hero"></div>
  <div id="c-menu"></div>
  <div id="c-travel"></div>
  <div id="c-party"></div>
  <div id="c-reviews"></div>
  <div id="c-location"></div>
  <div id="c-footer"></div>
  <div id="c-overlays"></div>

  <!-- Component Loader -->
  <script>
    const loadComp = (id, file) => fetch(`components/${file}`).then(r => r.text()).then(h => document.getElementById(id).innerHTML = h);

    Promise.all([
      loadComp('c-navbar', 'navbar.html'),
      loadComp('c-hero', 'hero.html'),
      loadComp('c-menu', 'menu.html'),
      loadComp('c-travel', 'travel.html'),
      loadComp('c-party', 'party.html'),
      loadComp('c-reviews', 'reviews.html'),
      loadComp('c-location', 'location.html'),
      loadComp('c-footer', 'footer.html'),
      loadComp('c-overlays', 'overlays.html')
    ]).then(() => {
      const script = document.createElement('script');
      script.src = 'app.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
